name: CI

# La misma puerta de calidad que exige la constitución (.specify/memory/constitution.md), corrida
# en un runner limpio. No reemplaza la corrida local: es la red que atrapa lo que sólo se rompe
# fuera de tu máquina (un bit de ejecución faltante, una dependencia que estaba instalada global,
# un lockfile desalineado).
on:
  # Push sobre cualquier rama que no sea main, además de en los PR. Así una feature ve y mide su
  # propio pipeline mientras se construye, en vez de descubrirlo recién al abrir el PR.
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# Sólo lectura del repo: el workflow no comenta, no etiqueta y no publica nada, así que el token no
# necesita permisos de escritura. Si algún día un job los precisa, se los agrega ese job y no el
# archivo entero.
permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la corrida anterior: lo que importa es el último commit.
#
# El grupo incluye `event_name` por una razón que costó un merge bloqueado: con un PR abierto, un
# push dispara DOS corridas del mismo commit —una por `push` y otra por `pull_request`— y sin el
# evento en el grupo caen las dos en el mismo balde y se cancelan entre sí. La check-run cancelada
# queda pegada al commit, arrastra el agregado de checks a FAILURE y el ruleset de main bloquea el
# merge aunque los dos jobs requeridos estén en verde.
#
# El costo es correr el pipeline dos veces por push mientras hay un PR abierto. Se paga a gusto:
# la alternativa era limitar `on: push` a main y perder lo que este archivo declara arriba, que una
# rama vea su propio pipeline mientras se construye.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint, tipos y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # pnpm antes que Node: setup-node necesita encontrarlo para resolver su caché.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile: si el lockfile no coincide con package.json, falla en vez de resolver
      # versiones nuevas por su cuenta. Una corrida de CI no es el lugar donde se decide una versión.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format

      # El type checker va aparte de los tests: Vitest transpila sin chequear tipos, así que un
      # error de tipos no aparecería en la suite.
      - name: Type checker
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

  backend:
    name: Backend — build y tests
    runs-on: ubuntu-latest

    # Los tests corren contra MySQL real: el tipo de columna y las restricciones del esquema son
    # justamente lo que verifican, y un proveedor en memoria es ciego a eso. El service container
    # corre en el propio runner —no es un servicio externo— y se destruye con el job.
    services:
      mysql:
        image: mysql:8.4
        env:
          # Base efímera, sin contraseña: así no hay ningún secreto que escribir en este archivo ni
          # que guardar en el repositorio. Vive lo que dura el job y nadie más la alcanza.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: gestiongastos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore backend/GestionGastos.slnx

      # Este paso ES el linter de calidad del backend: backend/Directory.Build.props enciende los
      # analizadores de Roslyn, que corren dentro de la compilación, y -warnaserror convierte
      # cualquier hallazgo en un PR roto. Qué reglas se aplican: backend/.editorconfig.
      - name: Build
        run: dotnet build backend/GestionGastos.slnx --no-restore -warnaserror

      # El formato va aparte del build, igual que el job de frontend separa Lint de Formato: los
      # analizadores miran calidad y `dotnet format` mira formato, y una sola de las dos familias
      # deja media barrera. Va entre Build y Tests para no cortar la cadena restore -> build -> test
      # que --no-restore y --no-build encadenan.
      - name: Formato
        run: dotnet format backend/GestionGastos.slnx --verify-no-changes --no-restore

      # El fixture crea y migra gestiongastos_test por su cuenta; acá sólo hace falta que el
      # servidor esté arriba y que la variable exista. Sin ella el fixture lanza a propósito, en vez
      # de adivinar contra qué base está escribiendo.
      #
      # Se excluyen los tests de rendimiento: miden tiempo de pared y en un runner compartido dan
      # rojos que no dicen nada del código. Siguen corriendo en local, que es donde la medición
      # significa algo.
      - name: Tests
        run: >-
          dotnet test backend/GestionGastos.slnx --no-build
          --filter "FullyQualifiedName!~Rendimiento"
        env:
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=gestiongastos_test;User ID=root;AllowPublicKeyRetrieval=true;"

      # El contrato HTTP está escrito dos veces —en los record de C# y en las interfaces de
      # frontend/src/api/tipos.ts— y si nada compara las dos copias, un rename coherente del backend
      # deja todo en verde y hace llegar undefined a la pantalla. Este paso comprueba que la barrera
      # que lo detecta sigue en pie, no sólo que los tests pasan (principio V de la constitución).
      #
      # Va después de Tests porque recompila con un DTO modificado, igual que la barrera del linter:
      # correrlo antes invalidaría el --no-build del paso de Tests.
      - name: Barrera del contrato
        run: ./backend/verificar-contrato.sh
        env:
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=gestiongastos_test;User ID=root;AllowPublicKeyRetrieval=true;"

      # Ningún endpoint responde sin sesión, salvo los dos de acceso declarados. Es la barrera más
      # importante del proyecto: un endpoint sin proteger no rompe nada visible, no da error, y
      # expone los datos de todas las cuentas. Descubre los endpoints en tiempo de ejecución, así
      # que también atrapa los que todavía no existen.
      #
      # También compila con un archivo temporal adentro —agrega un endpoint desprotegido y edita
      # Program.cs—, así que va después de Tests por la misma razón que las otras dos barreras.
      - name: Barrera de autorización
        run: ./backend/verificar-autorizacion.sh
        env:
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=gestiongastos_test;User ID=root;AllowPublicKeyRetrieval=true;"

      # La barrera del linter es configuración, y una barrera de configuración se puede desarmar en
      # silencio: alguien pone EnforceCodeStyleInBuild en false y el build sigue verde. Este paso es
      # lo único que se pone en rojo cuando eso pasa. Verifica las dos direcciones — una violación
      # deliberada rompe el build en código escrito a mano y no lo rompe dentro de Migrations/.
      #
      # Va ÚLTIMO a propósito: compila con un archivo temporal adentro, así que correrlo antes
      # invalidaría el --no-build del paso de Tests.
      # Ninguna cuenta ve ni toca los datos de otra. El aislamiento se sostiene en condiciones
      # escritas a mano —el acotado de la consulta y la asignación del propietario en el alta—, así
      # que una consulta nueva nace sin él salvo que alguien se acuerde. Este paso comprueba que los
      # tests que lo vigilan saben ponerse en rojo: un test de aislamiento roto devuelve verde igual
      # que uno que funciona, y sigue devolviéndolo el día que deja de verificar nada.
      #
      # También recompila con archivos modificados, así que va con las otras barreras, después de
      # Tests, para no invalidar su `--no-build`.
      - name: Barrera de aislamiento
        run: ./backend/verificar-aislamiento.sh
        env:
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=gestiongastos_test;User ID=root;AllowPublicKeyRetrieval=true;"

      - name: Barrera del linter
        run: ./backend/verificar-linter.sh
