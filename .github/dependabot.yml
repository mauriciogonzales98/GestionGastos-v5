# Dependabot: actualizaciones de dependencias, semanales.
# Un PR por grupo y no por paquete, con tope de PRs abiertos, para no inundar la cola.
version: 2
updates:
  # Frontend: React + Vite, gestionado con pnpm (el ecosistema "npm" cubre pnpm).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      frontend-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Backend: .NET 10, los PackageReference viven en los dos .csproj.
  - package-ecosystem: "nuget"
    directories:
      - "/backend/GestionGastos.Api"
      - "/backend/GestionGastos.Api.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 3
    groups:
      backend-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # El major de EF Core no lo decide EF Core: lo decide Pomelo, que es quien nos conecta a MySQL.
    # Pomelo 9.0.0 se compiló contra las abstracciones de EF Core 9, así que con EF Core 10 el build
    # pasa y los tests caen 102 de 136 con MissingMethodException sobre un interno que cambió de
    # firma. No es configurable, y no se arregla alineando Relational ni Design. Al cerrar el PR #9
    # no existía ninguna versión 10.x de Pomelo en NuGet, ni preview ni rc.
    # Pomelo queda deliberadamente SIN ignorar: su 10.x es la señal que destraba esto, y la
    # queremos como PR. Cuando llegue, se saca este ignore y el major de EF Core vuelve solo.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Las acciones de .github/workflows/ci.yml (checkout, setup-node, setup-dotnet, pnpm/action-setup).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 2
    groups:
      acciones:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
